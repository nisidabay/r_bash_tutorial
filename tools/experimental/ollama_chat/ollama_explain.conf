# ==============================================================================
# Configuration file for ollama_explain.sh
#
# This file allows you to set your preferences for the script without
# modifying the script itself.
# ==============================================================================

# --- Model Configuration ---
# Specify the default Ollama model you want to use for chats.
# If this is commented out or empty, the script will prompt you to choose
# from your list of available models.
# Example: MODEL=qwen2.5-coder:7b
MODEL=llama3.2:latest

# --- Editor Configuration ---
# Set the command-line editor to be used for tasks like editing history
# or configuration. Defaults to `nvim` if not set.
# Example: EDITOR=vim
EDITOR=nvim

# --- Pager Configuration ---
# Set the command-line pager used to display chat history (`!history`).
# Defaults to `less` if not set. `less` is a good default because it handles
# long files without loading them all into memory.
# Example: PAGER=less
PAGER=less
